[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-book-voice-adapt"
version = "0.1.0"
description = "Conservative local audiobook dialogue voice-conversion pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0.2,<7",
  "rapidfuzz>=3.9,<4",
  "requests>=2.32,<3",
  "ebooklib>=0.18,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1,<2"]
audio = ["numpy>=1.26,<3", "soundfile>=0.12,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
frontier = ["anthropic>=1.15,<2"]
gpu-windows = [
  "nvidia-cublas-cu12>=12.9; platform_system == 'Windows'",
  "nvidia-cudnn-cu12>=9.10; platform_system == 'Windows'",
]

[project.scripts]
audiobook-enhancer = "audiobook_voice_enhancer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
